<style>
  .sponsor-title {
    text-align: center;
    font-size: 2rem;
    margin-top: 2rem;
  }

  .sponsor-subtitle {
    text-align: center;
    font-size: 1.25rem;
    margin-top: 2rem;
    margin-bottom: 2rem;
  }

  .sponsor-grid {
    margin-top: 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .sponsor-grid .aspect-box {
    display: flex;
    align-items: center;
    background: white;
    padding: 0.5rem;
    border-radius: 1rem;
    box-shadow: 0.1rem 0.1rem 0.5rem rgb(0 0 0 / 0.05), 0.15rem 0.15rem 0.75rem rgb(0 0 0 / 0.1);
  }

  .sponsor-grid img {
    object-fit: contain;
    max-height: 3rem;
  }
    .sponsor-card--gold img {
    width: 16rem;
    max-height: 7rem;
  }

  .sponsor-card--silver img {
    width: 12rem;
    max-height: 5.75rem;
  }

  .sponsor-card--bronze img {
    width: 10rem;
    max-height: 4.5rem;
  }

  .sponsor-card--community img {
    width: 9rem;
    max-height: 3.25rem;
  }
</style>
<h3 class="sponsor-title">Our Sponsors and partners</h3>
<h4 class="sponsor-subtitle">Gold Sponsors</h4>
<div class="sponsor-grid">
  <a class="aspect-box sponsor-card--gold" target="_blank" href="{{ site.baseurl }}/sponsor/" title="Gold sponsor placeholder">
    <img src="{{ site.baseurl }}/assets/images/sponsors/your-logo-demo.svg" alt="Gold sponsor logo placeholder"/>
  </a>
</div>
<h4 class="sponsor-subtitle">Silver Sponsors</h4>
<div class="sponsor-grid">
  <a class="aspect-box sponsor-card--silver" target="_blank" href="{{ site.baseurl }}/sponsor/" title="Silver sponsor placeholder">
    <img src="{{ site.baseurl }}/assets/images/sponsors/your-logo-demo.svg" alt="Silver sponsor logo placeholder"/>
  </a>
</div>
<h4 class="sponsor-subtitle">Bronze Sponsors</h4>
<div class="sponsor-grid">
  <a class="aspect-box sponsor-card--bronze" target="_blank" href="https://www.pixalytics.com/" title="Pixalytics">
    <img src="{{ site.baseurl }}/assets/images/sponsors/pixalytics-logo.png" alt="Pixalytics logo"/>
  </a>
  <a class="aspect-box sponsor-card--bronze"  target="_blank" href="https://www.cgi.com/uk/en-gb" title="CGI">
    <img style="height: 3rem;" src="{{ site.baseurl }}/assets/images/sponsors/cgi.svg" alt="CGI logo"/>
  </a>
  <a class="aspect-box sponsor-card--bronze" target="_blank" href="https://nautoguide.com" title="Nautoguide">
    <img src="{{ site.baseurl }}/assets/images/sponsors/nautoguide.png"  alt="Nautoguide logo"/>
  </a>
   <a class="aspect-box sponsor-card--bronze" target="_blank" href="{{ site.baseurl }}/sponsor/" title="Bronze sponsor placeholder">
    <img src="{{ site.baseurl }}/assets/images/sponsors/your-logo-demo.svg" alt="Bronze sponsor logo placeholder"/>
  </a>
</div>
<h4 class="sponsor-subtitle">Community Sponsors</h4>
<div class="sponsor-grid">
  <a class="aspect-box" target="_blank" href="https://womeningeospatial.org" title="Women + in Geospatial">
    <img src="{{ site.baseurl }}/assets/images/sponsors/women_geospatial.png" alt="Women + in Geospatial logo"/>
  </a>
  <a class="aspect-box" target="_blank" href="https://www.agi.org.uk"
    title="The Association for Geographic Information">
    <img src="{{ site.baseurl }}/assets/images/sponsors/association-graphical-information.jpg" alt="The Association for Geographic Information logo"/>
  </a>
  <a class="aspect-box" target="_blank" href="https://www.hotosm.org/"
    title="Humanitarian OpenStreetMap Team">
    <img src="{{ site.baseurl }}/assets/images/sponsors/HOT_logo_with_text_Transparent_BG.png" alt="Humanitarian OpenStreetMap Team logo"/>
  </a>
</div>
</main>
<footer class="container"></footer>

</body>
